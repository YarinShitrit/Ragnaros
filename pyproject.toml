[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragnaros"
version = "0.1.0"
description = "Adaptive k-selection for RAG pipelines using statistical hypothesis testing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Yarin Shitrit", email = "yarin@example.com" }
]
keywords = [
  "rag",
  "retrieval-augmented-generation",
  "langchain",
  "nlp",
  "information-retrieval",
  "dynamic-k",
  "higher-criticism",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "langchain-core>=0.3",
  "numpy>=1.26",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
viz = [
  "matplotlib>=3.8",
  "scipy>=1.11",
]
eval = [
  "pandas>=2.1",
  "tqdm>=4.66",
]
langchain = [
  "langchain>=0.3",
  "langchain-openai>=0.2",
  "langchain-chroma>=0.1",
]
all = [
  "ragnaros[viz,eval,langchain]",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.10",
  "langchain>=0.3",
  "langchain-openai>=0.2",
  "langchain-chroma>=0.1",
  "faiss-cpu>=1.8",
]

[project.urls]
Homepage = "https://github.com/yarinshitrit/RAGnaros"
Repository = "https://github.com/yarinshitrit/RAGnaros"
"Bug Tracker" = "https://github.com/yarinshitrit/RAGnaros/issues"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------

[tool.hatch.build.targets.wheel]
packages = ["ragnaros"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--tb=short -q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
